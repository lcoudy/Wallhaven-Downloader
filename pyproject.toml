[project]
name = "wallhaven-downloader"
version = "0.1.0"
description = "A Wallhaven wallpaper batch downloader with PyQt UI and CLI entry points."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Lthero" },
    { name = "lcoudy" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "oss2>=2.18",
    "PyQt5>=5.15",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "requests>=2.31",
]

[tool.uv]
package = false
